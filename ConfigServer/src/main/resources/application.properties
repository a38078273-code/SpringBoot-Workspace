server.port=8888

# Profil native : lit myconfig/ sans JGit (évite erreur 500 si mauvais working directory)
spring.profiles.active=native
# classpath = fonctionne même si le working directory est WorkspaceSpring
spring.cloud.config.server.native.search-locations=classpath:/myconfig

# Variante TP avec Git (working directory = ConfigServer obligatoire) :
# spring.cloud.config.server.git.default-label=master
# spring.cloud.config.server.git.uri=file:./src/main/resources/myconfig
