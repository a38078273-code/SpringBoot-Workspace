spring.application.name=membre-service

# TP : config obligatoire si Config Server tourne en premier (sans "optional:")
# Développement seul : "optional:" permet de démarrer sans :8888 ; repli ci-dessous
spring.config.import=optional:configserver:http://localhost:8888

# Repli si Config Server absent (remplacé par membre-service.properties quand :8888 répond)
spring.datasource.url=jdbc:h2:file:./data/membre-service;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
server.port=8080
